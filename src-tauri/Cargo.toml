[package]
name = "aulo"
version = "0.1.0"
description = "Local music creation, powered by YUE2 // GROOVE"
authors = ["Aulo contributors"]
edition = "2021"

[lib]
name = "aulo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
fs2 = "0.4"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
trash = "5"
claxon = "0.4.3"
hound = "3.5.1"
mp3lame-encoder = "0.2.5"
lofty = "0.25"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", features = ["NSResponder", "NSSharingService", "NSView"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["ApplicationModel_DataTransfer", "Foundation", "Storage", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_Graphics_Dxgi", "Win32_System_Power"] }
windows-collections = "0.3"
