name: Package Windows app

# Builds the self-contained music engine (CPU-only PyTorch with the GGUF engine's
# yue2.cpp) and the Aulo installer that carries it. Manual or on version tags, like
# the macOS package: the engine download is large, so ordinary pushes skip it.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Build the bundled engine
        run: python scripts/build_engine.py --out src-tauri/engine
      - name: Check the engine starts without any other Python
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:HF_HUB_OFFLINE = "1"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          '{"protocolVersion":3,"operation":"probe"}' |
            src-tauri/engine/python/python.exe -I runtime/bridge.py
      - name: Bundle Aulo with the engine
        run: npm run bundle -- --bundles nsis
      - name: Install the installer silently and check what it put on disk
        shell: pwsh
        run: |
          $installer = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          "{0}: {1:N0} MB" -f $installer.Name, ($installer.Length / 1MB)
          # NSIS keeps its data behind 32-bit offsets; installers past about 2 GB are
          # widely reported to fail. No official figure, so this is a safety margin.
          if ($installer.Length -gt 2GB) { throw "the installer is over 2 GB" }
          $dir = Join-Path $env:RUNNER_TEMP "Aulo install"
          # /D must come last and unquoted, even with spaces.
          $setup = Start-Process -Wait -PassThru -FilePath $installer.FullName -ArgumentList "/S /D=$dir"
          if ($setup.ExitCode -ne 0) { throw "the installer exited with $($setup.ExitCode)" }
          Get-ChildItem $dir | Format-Table Name, Length
          if (-not (Get-ChildItem $dir -Filter *.exe | Where-Object Name -ne "uninstall.exe")) {
            throw "the app was not installed"
          }
          $synth = Get-ChildItem (Join-Path $dir engine) -Recurse -Filter yue-synth.exe
          if (-not $synth) { throw "the installed engine has no yue-synth.exe" }
          $synth | ForEach-Object { $_.FullName }
          $env:PYTHONDONTWRITEBYTECODE = "1"
          $env:HF_HUB_OFFLINE = "1"
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          # The app writes this same bridge.py out when it starts the engine.
          '{"protocolVersion":3,"operation":"probe"}' |
            & (Join-Path $dir engine/python/python.exe) -I runtime/bridge.py
          if ($LASTEXITCODE -ne 0) { throw "the installed engine did not start" }
      - uses: actions/upload-artifact@v4
        with:
          name: Aulo-windows-x64
          path: src-tauri/target/release/bundle/nsis/*.exe
